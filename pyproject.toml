[build-system]
requires = ["setuptools>=68,<75"]
build-backend = "setuptools.build_meta"

[project]
name = "cbp-action"
version = "1.5.2"
description = "Reusable repository quality gates for GitHub Actions and local CI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CBP contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
cbp = "cbp.cli:main"

[project.optional-dependencies]
policy = ["cel-python>=0.5.0"]
test = [
  "pytest>=8.0",
  "requests>=2.31",
  "certifi>=2024.0",
  "cel-python>=0.5.0",
  "coverage>=7.6",
  "jsonschema>=4.20",
]

[tool.setuptools.package-data]
cbp = ["data/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/cbp", "tools"]
branch = true
