name: verify-release
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Verify latest release body and asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --json tagName --jq .tagName)
          mkdir -p dist
          gh release download "$TAG" -p RELEASE_ASSETS.sha256 -D dist --clobber
          python -m cbp.cli --root "$GITHUB_WORKSPACE" --verify-release "$TAG" --repository "$GITHUB_REPOSITORY"
