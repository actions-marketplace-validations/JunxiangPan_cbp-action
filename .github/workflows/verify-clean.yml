name: verify-clean
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
      ci_run_id:
        required: true
      release_run_id:
        description: release.yml run id that published the body
        required: true
permissions:
  contents: read
  actions: read
jobs:
  clean-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Download artifact into isolated directory
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          rm -rf dist-verify
          gh run download "$CI_RUN_ID" -n cbp-dist -D dist-verify
          (cd dist-verify && sha256sum -c WHEEL_SHA256)
      - name: Install released wheel
        run: python -m pip install --no-deps dist-verify/*.whl
      - name: Download asset manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ inputs.tag }}" -p RELEASE_ASSETS.sha256 -D dist --clobber
      - name: Download the body that run published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          mkdir -p dist
          gh run download "$RELEASE_RUN_ID" -n "release-body-$RELEASE_RUN_ID" -D dist
          test -f dist/RELEASE_BODY.md
      - name: Verify release body and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m cbp.cli --root . --release-body dist/RELEASE_BODY.md --verify-release "${{ inputs.tag }}" --repository "${{ github.repository }}"
