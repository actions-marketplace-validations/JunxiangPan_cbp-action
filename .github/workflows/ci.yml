name: cbp-ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    name: build-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build --wheel --sdist --outdir dist
      - name: Generate wheel manifest once
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > WHEEL_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cbp-dist
          path: dist/
          if-no-files-found: error

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify quality gate manifest
        run: python tools/verify_gate_manifest.py quality/GATES.sha256
      - name: Reject tracked build artifacts
        run: |
          tracked=$(git ls-files 'dist/*' '*.whl' '*.tar.gz')
          if [ -n "$tracked" ]; then
            echo "TRACKED_BUILD_ARTIFACTS"
            echo "$tracked"
            exit 1
          fi
          echo "NO_TRACKED_BUILD_ARTIFACTS"

  test-coverage:
    name: test-coverage (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        continue-on-error: ${{ matrix.python == '3.10' }}
        with:
          python-version: ${{ matrix.python }}
      - name: Record Python 3.10 skip
        if: matrix.python == '3.10' && steps.setup.outcome == 'failure'
        run: echo "PYTHON_310_SKIPPED reason=setup-python-504-or-unavailable" >> "$GITHUB_STEP_SUMMARY"
      - run: python -m pip install --upgrade pip
        if: steps.setup.outcome == 'success'
      - run: python -m pip install -e ".[test]"
        if: steps.setup.outcome == 'success'
      - run: python -m coverage run --branch --source=src/cbp,tools -m pytest -q tests
        if: steps.setup.outcome == 'success'
      - run: python -m coverage json -o coverage.json
        if: steps.setup.outcome == 'success'
      - run: python tools/stamp_coverage.py --root . --coverage coverage.json
        if: steps.setup.outcome == 'success'
      - name: Upload coverage JSON
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-json-${{ github.run_id }}
          path: coverage.json
          if-no-files-found: error

  dogfood-generate:
    name: dogfood-generate
    needs: [test-coverage, build]
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTIONS: "true"
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Download coverage JSON
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-json-${{ github.run_id }}
          path: .
      - name: Download build artifact for dogfood
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cbp-dist
          path: dist
      - name: Verify build artifact hash
        run: |
          test -n "$(ls dist/*.whl)"
          (cd dist && sha256sum -c WHEEL_SHA256)
      - name: Generate manifest from real gates
        run: |
          python tools/dogfood_manifest.py --root=. --coverage-json=coverage.json --output=quality-manifest.json --notes-template=docs/RELEASE_NOTES.md --notes-output=docs/RELEASE_NOTES.generated.md --run-id="$GITHUB_RUN_ID" --commit-sha="$GITHUB_SHA"
      - name: Validate generated manifest
        run: |
          python - <<'PY'
          import json
          from tools.dogfood_manifest import validate_manifest

          with open("quality-manifest.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          problems = validate_manifest(manifest, actions=True)
          if problems:
              raise SystemExit("manifest validation failed: " + "; ".join(problems))
          print("MANIFEST_VALID")
          PY
      - name: Rule source audit
        run: python tools/audit_rule_sources.py --root .
      - name: Upload generated manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-manifest-${{ github.run_id }}
          path: |
            quality-manifest.json
            quality-manifest.json.sha256
            docs/RELEASE_NOTES.generated.md
            dist/RELEASE_BODY.md
          if-no-files-found: error

  dogfood-verify:
    name: dogfood-verify
    needs: dogfood-generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Download coverage JSON
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-json-${{ github.run_id }}
          path: .
      - name: Download generated manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quality-manifest-${{ github.run_id }}
          path: artifact
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cbp-dist
          path: dist
      - name: Verify manifest hash
        run: |
          actual=$(sha256sum artifact/quality-manifest.json | awk '{print $1}')
          expected=$(awk '{print $1}' artifact/quality-manifest.json.sha256)
          echo "artifact_manifest=$GITHUB_WORKSPACE/artifact/quality-manifest.json"
          echo "actual=$actual"
          echo "expected=$expected"
          test "$actual" = "$expected"
      - name: Verify manifest with CBP from artifact
        env:
          CBP_MANIFEST: ${{ github.workspace }}/artifact/quality-manifest.json
          CBP_NOTES: ${{ github.workspace }}/artifact/docs/RELEASE_NOTES.generated.md
          CBP_BODY: ${{ github.workspace }}/artifact/dist/RELEASE_BODY.md
        run: |
          echo "CBP_MANIFEST=$CBP_MANIFEST"
          python -m cbp.cli --root . --mode enforce --manifest="$CBP_MANIFEST" --claims-notes="$CBP_NOTES" --release-body="$CBP_BODY"

  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Bare-repository quick start
        run: |
          mkdir -p /tmp/cbp-quickstart
          cd /tmp/cbp-quickstart
          cbp init --root .
          test -f cbp.json
          cbp --root . | tee result.txt
          grep -q 'CBP_RESULT=PASS' result.txt
          grep -q 'SKIPPED (not configured)' result.txt


  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python tools/benchmark.py --counts 1000,5000,20000

  sarif:
    needs: dogfood-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Download coverage JSON
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-json-${{ github.run_id }}
          path: .
      - name: Download generated manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quality-manifest-${{ github.run_id }}
          path: .
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cbp-dist
          path: dist
      - name: Emit SARIF
        run: |
          python -m cbp.cli --root . --sarif-output cbp.sarif
          test -s cbp.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cbp-sarif
          path: cbp.sarif
      - uses: github/codeql-action/upload-sarif@b7b84b636b4f90c9b31da1bc5f72bfadd5b31410
        with:
          sarif_file: cbp.sarif

  double-build:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cbp-dist
          path: dist
      - name: Verify the single build artifact
        run: |
          test -n "$(ls dist/*.whl)"
          (cd dist && sha256sum -c WHEEL_SHA256)

  checks:
    needs: dogfood-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Download coverage JSON
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-json-${{ github.run_id }}
          path: .
      - name: Download generated manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quality-manifest-${{ github.run_id }}
          path: .
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cbp-dist
          path: dist
      - name: Publish per-gate check runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/github_checks.py --root . --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --token "$GITHUB_TOKEN"

  benchmark-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python tools/benchmark_cache.py --count 5000

  benchmark-ast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python tools/benchmark_ast.py --count 5000

  ai-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Run AI gates (audit, visible)
        run: |
          set +e
          REL=0; TEST=0; CHG=0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python -m cbp.cli --gate ai-release --tag "$GITHUB_REF_NAME" --mode audit --sarif-output ai-release.sarif
            REL=$?
          else
            echo "AI_GATE=ai-release status=SKIP reason=not-a-tag-ref"
          fi
          python -m cbp.cli --gate ai-test --test-path tests/fixtures/ai_no_assert.py --mode audit --sarif-output ai-test.sarif
          TEST=$?
          python -m cbp.cli --gate ai-change --baseline HEAD~1 --mode audit --sarif-output ai-change.sarif
          CHG=$?
          echo "AI_GATE_SUMMARY ai-release=$REL ai-test=$TEST ai-change=$CHG" | tee -a "$GITHUB_STEP_SUMMARY"
          failed=0
          if [ "$TEST" -ne 0 ]; then echo "AI_GATE_CRASH gate=ai-test exit=$TEST" >&2; failed=1; fi
          if [ "$CHG" -ne 0 ]; then echo "AI_GATE_CRASH gate=ai-change exit=$CHG" >&2; failed=1; fi
          if [ ! -s ai-test.sarif ]; then echo "AI_GATE_NO_SARIF gate=ai-test" >&2; failed=1; fi
          if [ ! -s ai-change.sarif ]; then echo "AI_GATE_NO_SARIF gate=ai-change" >&2; failed=1; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "$REL" -ne 0 ]; then echo "AI_GATE_CRASH gate=ai-release exit=$REL" >&2; failed=1; fi
            if [ ! -s ai-release.sarif ]; then echo "AI_GATE_NO_SARIF gate=ai-release" >&2; failed=1; fi
          fi
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-audit-sarif
          path: ai-*.sarif

  cbp-gate:
    name: cbp-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Run CBP production gate
        run: python -m cbp.cli --root . --v12
      - name: Verify CBP gate self-protection
        run: python tools/verify_gate_manifest.py quality/GATES.sha256
