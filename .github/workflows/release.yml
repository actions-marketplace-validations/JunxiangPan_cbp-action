name: release
on:
  workflow_dispatch:
    inputs:
      rc_run_id:
        description: RC run id whose attested cbp-rc bundle is released
        required: true
      ci_run_id:
        description: CI run id whose quality-manifest artifact is released
        required: true
      release_tag:
        description: Release tag, for example v1.2.0
        required: true
      e2e_run_id:
        description: e2e-payload run id that proved the hostile-input cases
        required: false
      expected_wheel_sha256:
        description: Exact wheel sha256 from the audited cbp-rc run
        required: true
      expected_sdist_sha256:
        description: Exact sdist sha256 from the audited cbp-rc run
        required: true
      allow_placeholders:
        description: Explicitly allow unresolved GitHub placeholder strings
        type: boolean
        default: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Verify quality gate manifest
        run: python tools/verify_gate_manifest.py quality/GATES.sha256
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Validate RC provenance without creating a release
        env:
          GH_TOKEN: ${{ github.token }}
          RC_RUN_ID: ${{ inputs.rc_run_id }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          E2E_RUN_ID: ${{ inputs.e2e_run_id }}
          EXPECTED_WHEEL: ${{ inputs.expected_wheel_sha256 }}
          EXPECTED_SDIST: ${{ inputs.expected_sdist_sha256 }}
        run: |
          python tools/release_preflight.py \
            --rc-run-id "$RC_RUN_ID" \
            --ci-run-id "$CI_RUN_ID" \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --e2e-run-id "$E2E_RUN_ID" \
            --expected-wheel-sha256 "$EXPECTED_WHEEL" \
            --expected-sdist-sha256 "$EXPECTED_SDIST"

  verify-artifact:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require green CI before publish
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          case "$CI_RUN_ID" in (*[!0-9]*|'') echo "invalid ci_run_id" >&2; exit 2;; esac
          STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/$CI_RUN_ID" --jq .conclusion)
          test "$STATUS" = "success" || { echo "CI run $CI_RUN_ID is $STATUS, refusing publish" >&2; exit 3; }
      - name: Reject placeholder bypass in GitHub Actions
        if: ${{ inputs.allow_placeholders == true }}
        run: |
          echo "allow_placeholders is not permitted in GitHub Actions" >&2
          exit 1
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid release_tag" >&2; exit 2;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Verify quality gate manifest
        run: python tools/verify_gate_manifest.py quality/GATES.sha256
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Require the CI and RC runs to be the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RC_RUN_ID: ${{ inputs.rc_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG_COMMIT=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          CI_COMMIT=$(gh api "repos/${{ github.repository }}/actions/runs/$CI_RUN_ID" --jq .head_sha)
          RC_COMMIT=$(gh api "repos/${{ github.repository }}/actions/runs/$RC_RUN_ID" --jq .head_sha)
          echo "tag_commit=$TAG_COMMIT"
          echo "ci_commit=$CI_COMMIT"
          echo "rc_commit=$RC_COMMIT"
          test "$TAG_COMMIT" = "$CI_COMMIT" || { echo "TAG != CI COMMIT" >&2; exit 3; }
          test "$TAG_COMMIT" = "$RC_COMMIT" || { echo "TAG != RC COMMIT" >&2; exit 3; }
      - name: Download manifest artifact by explicit run id
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          case "$CI_RUN_ID" in (*[!0-9]*|'') echo "invalid ci_run_id" >&2; exit 2;; esac
          gh run download "$CI_RUN_ID" -n "quality-manifest-$CI_RUN_ID" -D artifact
      - name: Verify manifest hash, run id, commit, and notes
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python tools/verify_manifest_artifact.py --manifest=artifact/quality-manifest.json --hash=artifact/quality-manifest.json.sha256 --notes=artifact/docs/RELEASE_NOTES.generated.md --run-id="$CI_RUN_ID" --commit-sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" --require-gate-pass
      - name: Check Action metadata files
        run: |
          pwd
          ls -la "$GITHUB_WORKSPACE/action.yml"
          test -f "$GITHUB_WORKSPACE/action.yml"
          test -f "$GITHUB_WORKSPACE/README.md"
          test -f "$GITHUB_WORKSPACE/usage.yml"
          test -f "$GITHUB_WORKSPACE/SECURITY.md"
          for name in root config coverage-json coverage-allowlist coverage-signature require-coverage-signature coverage-threshold policy-coverage-threshold dependency-lock install-command docs-manifest binary-artifacts package-zip claims-manifest claims-notes release-body sarif-output baseline enable-coverage enable-encoding enable-dependency enable-comments enable-docs enable-binary enable-claims enable-custom enable-upgrade mode; do
            grep -q "^  ${name}:" "$GITHUB_WORKSPACE/action.yml"
          done

  publish:
    needs: [preflight, verify-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Validate release tag and hashes
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_WHEEL: ${{ inputs.expected_wheel_sha256 }}
          EXPECTED_SDIST: ${{ inputs.expected_sdist_sha256 }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid release_tag" >&2; exit 2;;
          esac
          case "$EXPECTED_WHEEL" in (*[!0-9a-f]*|'') echo "invalid wheel hash" >&2; exit 2;; esac
          case "$EXPECTED_SDIST" in (*[!0-9a-f]*|'') echo "invalid sdist hash" >&2; exit 2;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Verify quality gate manifest
        run: python tools/verify_gate_manifest.py quality/GATES.sha256
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Download the audited RC bundle and the CI manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RC_RUN_ID: ${{ inputs.rc_run_id }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          rm -rf rc artifact
          gh run download "$RC_RUN_ID" -n cbp-rc -D rc
          gh run download "$CI_RUN_ID" -n "quality-manifest-$CI_RUN_ID" -D artifact
          test -f rc/RC_ASSETS.sha256
          test -f artifact/quality-manifest.json
      - name: Check the exact RC artifact hashes
        env:
          EXPECTED_WHEEL: ${{ inputs.expected_wheel_sha256 }}
          EXPECTED_SDIST: ${{ inputs.expected_sdist_sha256 }}
        run: |
          WHEEL=$(sha256sum rc/*.whl | awk '{print $1}')
          SDIST=$(sha256sum rc/*.tar.gz | awk '{print $1}')
          test "$WHEEL" = "$EXPECTED_WHEEL" || { echo "wheel hash mismatch: $WHEEL != $EXPECTED_WHEEL" >&2; exit 3; }
          test "$SDIST" = "$EXPECTED_SDIST" || { echo "sdist hash mismatch: $SDIST != $EXPECTED_SDIST" >&2; exit 3; }
          (cd rc && sed 's#  dist/#  #' RC_ASSETS.sha256 | sha256sum -c -)
      - name: Verify tag, RC and CI commits agree
        env:
          GH_TOKEN: ${{ github.token }}
          RC_RUN_ID: ${{ inputs.rc_run_id }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG_COMMIT=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          RC_COMMIT=$(gh api "repos/${{ github.repository }}/actions/runs/$RC_RUN_ID" --jq .head_sha)
          CI_COMMIT=$(gh api "repos/${{ github.repository }}/actions/runs/$CI_RUN_ID" --jq .head_sha)
          test "$TAG_COMMIT" = "$RC_COMMIT" || { echo "tag != RC commit" >&2; exit 3; }
          test "$TAG_COMMIT" = "$CI_COMMIT" || { echo "tag != CI commit" >&2; exit 3; }
      - name: Install the audited RC wheel
        run: |
          python -m pip install --force-reinstall --no-deps rc/*.whl
          python -c "import cbp; print(cbp.__file__)"
      - name: Generate the release body that will be published
        env:
          RELEASE_VERSION: ${{ inputs.release_tag }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          E2E_RUN_ID: ${{ inputs.e2e_run_id }}
        run: |
          python tools/generate_release_body.py --wheel rc/*.whl --version "$RELEASE_VERSION" --notes artifact/docs/RELEASE_NOTES.generated.md --output rc/RELEASE_BODY.md --ci-run "$CI_RUN_ID" --e2e-run "$E2E_RUN_ID" --double-build-run "$CI_RUN_ID" --sarif-run "$CI_RUN_ID" --signed-keyless
      - name: Remint the manifest from the RC hashes and the final body
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RC_RUN_ID: ${{ inputs.rc_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python tools/remint_manifest.py \
            --manifest artifact/quality-manifest.json \
            --artifact rc/*.whl --artifact rc/*.tar.gz \
            --release-body rc/RELEASE_BODY.md \
            --artifact-repository "$GITHUB_REPOSITORY" \
            --artifact-run-id "$RC_RUN_ID" \
            --artifact-name cbp-rc \
            --expect-run-id "$CI_RUN_ID" \
            --expect-commit "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" \
            --out artifact/quality-manifest.json
          (cd artifact && sha256sum quality-manifest.json > quality-manifest.json.sha256)
      - name: Verify the reminted manifest
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python tools/verify_manifest_artifact.py --manifest=artifact/quality-manifest.json --hash=artifact/quality-manifest.json.sha256 --notes=artifact/docs/RELEASE_NOTES.generated.md --run-id="$CI_RUN_ID" --commit-sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" --require-gate-pass
      - name: Assert manifest artifact and body hashes equal the RC/body
        run: |
          python tools/remint_manifest.py --manifest artifact/quality-manifest.json --artifact rc/*.whl --artifact rc/*.tar.gz --release-body rc/RELEASE_BODY.md --check-only
      - name: Verify manifest binds the published body
        env:
          CBP_BODY_MANIFEST: artifact/quality-manifest.json
          CBP_BODY_FILE: rc/RELEASE_BODY.md
        run: python -m cbp.cli --root . --v12 --v12-only CBP-BODY-001
      - name: Generate the signed provenance sidecar
        env:
          RC_RUN_ID: ${{ inputs.rc_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          COMMIT=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          python tools/provenance.py create \
            --manifest artifact/quality-manifest.json \
            --artifact rc/*.whl --artifact rc/*.tar.gz \
            --output-dir provenance \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$RC_RUN_ID" --tag "$RELEASE_TAG" --commit "$COMMIT" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --keyless
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
        with:
          cosign-release: "v2.4.1"
      - name: Sign release blobs with GitHub OIDC keyless cosign
        run: |
          mkdir -p signatures
          for file in rc/*.whl rc/*.tar.gz artifact/quality-manifest.json provenance/provenance.json; do
            name=$(basename "$file")
            cosign sign-blob --yes \
              --bundle "signatures/$name.bundle" \
              --output-signature "signatures/$name.sig" \
              --output-certificate "signatures/$name.pem" \
              "$file"
          done
          cosign attest-blob --yes --predicate provenance/predicate.json --type slsaprovenance1 --bundle signatures/attestation.json rc/*.whl
          cosign attest-blob --yes --predicate provenance/predicate.json --type slsaprovenance1 --bundle signatures/attestation-sdist.json rc/*.tar.gz
      - name: Verify keyless signatures and attestations
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          ISSUER="https://token.actions.githubusercontent.com"
          for file in rc/*.whl rc/*.tar.gz artifact/quality-manifest.json provenance/provenance.json; do
            name=$(basename "$file")
            cosign verify-blob --bundle "signatures/$name.bundle" \
              --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$file"
          done
          cosign verify-blob-attestation --bundle signatures/attestation.json --type slsaprovenance1 \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" rc/*.whl
          cosign verify-blob-attestation --bundle signatures/attestation-sdist.json --type slsaprovenance1 \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" rc/*.tar.gz
          python tools/provenance.py verify \
            --provenance provenance/provenance.json \
            --manifest artifact/quality-manifest.json \
            --artifact rc/*.whl --artifact rc/*.tar.gz \
            --bundle-dir signatures \
            --identity-regexp "$IDENTITY" \
            --oidc-issuer "$ISSUER"
      - name: Verify the RC attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify rc/*.whl --repo "$GITHUB_REPOSITORY"
          gh attestation verify rc/*.tar.gz --repo "$GITHUB_REPOSITORY"
      - name: Generate release asset manifest from the RC bundle
        run: |
          cd rc
          sha256sum *.whl *.tar.gz ../artifact/quality-manifest.json ../artifact/quality-manifest.json.sha256 ../artifact/docs/RELEASE_NOTES.generated.md ../provenance/provenance.json ../provenance/predicate.json ../signatures/* | awk '{n=$2; sub(/.*\//,"",n); print $1 " *" n}' > RELEASE_ASSETS.sha256
      - name: Expose the release asset manifest to the AI gate
        run: |
          mkdir -p dist
          cp rc/RELEASE_ASSETS.sha256 dist/RELEASE_ASSETS.sha256
      - name: Upload the release body used for publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-body-${{ github.run_id }}
          path: rc/RELEASE_BODY.md
          if-no-files-found: error
      - name: AI release gate before publish
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p docs
          cp artifact/docs/RELEASE_NOTES.generated.md docs/RELEASE_NOTES.generated.md
          python -m cbp.cli --gate ai-release --tag "$RELEASE_TAG" --release-body rc/RELEASE_BODY.md --mode enforce
      - name: Publish release from the audited RC bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in (v[0-9]*.[0-9]*.[0-9]*) ;; (*) echo "invalid release_tag" >&2; exit 2;; esac
          test -f artifact/docs/RELEASE_NOTES.generated.md
          gh release create "$RELEASE_TAG" rc/*.whl rc/*.tar.gz rc/RELEASE_ASSETS.sha256 artifact/quality-manifest.json artifact/quality-manifest.json.sha256 artifact/docs/RELEASE_NOTES.generated.md provenance/provenance.json provenance/predicate.json signatures/* --notes-file rc/RELEASE_BODY.md
      - name: Verify published release body and asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python -m cbp.cli --root "$GITHUB_WORKSPACE" --release-body rc/RELEASE_BODY.md --release-assets rc/RELEASE_ASSETS.sha256 --verify-release "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"

  clean-verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid release_tag" >&2; exit 2;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Download the audited RC bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RC_RUN_ID: ${{ inputs.rc_run_id }}
        run: |
          rm -rf dist-verify
          gh run download "$RC_RUN_ID" -n cbp-rc -D dist-verify
          (cd dist-verify && sed 's#  dist/#  #' RC_ASSETS.sha256 | sha256sum -c -)
      - name: Install the released wheel on a clean runner
        run: python -m pip install --no-deps dist-verify/*.whl
      - name: Download the body this run published
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-body-${{ github.run_id }}
          path: dist
      - name: Download asset manifest and verify body + assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in (v[0-9]*.[0-9]*.[0-9]*) ;; (*) echo "invalid release_tag" >&2; exit 2;; esac
          mkdir -p dist
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p RELEASE_ASSETS.sha256 -D dist --clobber
          python -m cbp.cli --root "$GITHUB_WORKSPACE" --release-body dist/RELEASE_BODY.md --release-assets dist/RELEASE_ASSETS.sha256 --verify-release "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
