name: cbp-rc

# Build and attest a release candidate WITHOUT publishing it. PyPI and the
# GitHub Release stay untouched; the attestation and hashes are the hand-off
# artifacts for human audit.
on:
  push:
    branches: [1.2.0-dev]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: true
        default: 1.2.0-dev

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --quiet build
          python -m build --wheel --sdist --outdir dist
      - name: Hash the RC artifacts
        run: |
          sha256sum dist/*.whl dist/*.tar.gz | tee dist/RC_ASSETS.sha256
      - name: Attest the wheel
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: "dist/*.whl"
      - name: Attest the sdist
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: "dist/*.tar.gz"
      - name: Upload the RC bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cbp-rc
          path: dist/
