name: e2e-payload
on:
  workflow_dispatch:
    inputs:
      cbp-version:
        description: Published release tag the composite action must consume
        required: false
  pull_request:
jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.cbp-version }}
        run: |
          VERSION="${REQUESTED:-}"
          if [ -z "$VERSION" ]; then
            VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid release tag: $VERSION" >&2; exit 2 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "CBP_E2E_VERSION=$VERSION"

  payload-e2e:
    needs: resolve-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        input: [root, coverage-json, config]
        payload:
          - '$(touch /tmp/pwned)'
          - '`touch /tmp/pwned`'
          - "line1\n$(touch /tmp/pwned)"
          - '; touch /tmp/pwned'
          - '--help'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run action with hostile input
        uses: ./
        continue-on-error: true
        with:
          cbp-version: ${{ needs.resolve-version.outputs.version }}
          root: ${{ matrix.input == 'root' && matrix.payload || '.' }}
          coverage-json: ${{ matrix.input == 'coverage-json' && matrix.payload || '' }}
          config: ${{ matrix.input == 'config' && matrix.payload || '' }}
      - name: Assert payload not executed
        run: |
          if [ -e /tmp/pwned ]; then echo "PAYLOAD EXECUTED"; exit 1; fi
          echo "PAYLOAD NOT EXECUTED input=${{ matrix.input }}"

  consumer-parity:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prepare a minimal consumer repository
        run: |
          mkdir -p consumer
          cat > consumer/cbp.json <<'JSON'
          {
            "schema_version": "1.0.8",
            "enable_coverage": false,
            "enable_dependency": false,
            "enable_comments": false,
            "enable_docs": false,
            "enable_binary": false,
            "enable_claims": false,
            "enable_custom": false,
            "enable_upgrade": false,
            "enable_encoding": true
          }
          JSON
          printf 'consumer fixture\n' > consumer/README.md
      - name: Run the composite action as a consumer
        id: cbp
        uses: ./
        with:
          cbp-version: ${{ needs.resolve-version.outputs.version }}
          root: consumer
          mode: audit
      - name: Assert the action installed the released wheel
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          WHEEL: ${{ steps.cbp.outputs.wheel-path }}
          REPORTED: ${{ steps.cbp.outputs.wheel-sha256 }}
        run: |
          set -uo pipefail
          if [ -z "$WHEEL" ]; then
            echo "CONSUMER_VIEW_FAILED reason=action-did-not-report-a-wheel" >&2
            exit 1
          fi
          if [ ! -f "$WHEEL" ]; then
            echo "CONSUMER_VIEW_FAILED reason=wheel-missing path=$WHEEL" >&2
            exit 1
          fi
          INSTALLED=$(sha256sum "$WHEEL" | awk '{print $1}')
          RELEASED=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name | endswith(".whl")) | .digest' \
            | sed -e 's/^sha256://' | tr -d '\r')
          echo "installed=$INSTALLED"
          echo "reported=$REPORTED"
          echo "released=$RELEASED"
          if [ -z "$RELEASED" ]; then
            echo "CONSUMER_VIEW_FAILED reason=no-release-digest" >&2
            exit 1
          fi
          if [ "$INSTALLED" != "$RELEASED" ]; then
            echo "CONSUMER_VIEW_FAILED reason=installed-ne-release installed=$INSTALLED released=$RELEASED" >&2
            exit 1
          fi
          if [ "$REPORTED" != "$RELEASED" ]; then
            echo "CONSUMER_VIEW_FAILED reason=reported-ne-release reported=$REPORTED released=$RELEASED" >&2
            exit 1
          fi
          gh attestation verify "$WHEEL" --repo "$GITHUB_REPOSITORY"
          echo "CONSUMER_VIEW_OK wheel=$INSTALLED version=$VERSION"
